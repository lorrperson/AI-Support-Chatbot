<!DOCTYPE html>
<html>

<head>

    <title>Optimus Support</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        #chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        #chat-box {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }

        .user-msg {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .bot-msg {
            background: #e9ecef;
            color: black;
            align-self: flex-start;
        }

        #input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }

        #user-input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
        }

        #send-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
        }

        #send-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div id="chat-container">
        <div id="header">Optimus Support Bot</div>
        <div id="chat-box">
            <div class="message bot-msg">Hello! I can answer questions about Life Insurance. How can I help you today?
            </div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a question..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (!message) return;

            // Clear input and add user message to screen
            inputField.value = "";
            addMessage(message, "user-msg");

            // Show a temporary "thinking..." message
            const chatBox = document.getElementById("chat-box");
            const thinkingId = "thinking-" + Date.now();
            addMessage("Optimus is thinking...", "bot-msg", thinkingId);

            // Send the message to your FastAPI backend
            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();

                // Remove the thinking message and show the real answer
                document.getElementById(thinkingId).remove();
                addMessage(data.reply, "bot-msg");
            } catch (error) {
                document.getElementById(thinkingId).remove();
                addMessage("Error: Could not connect to server.", "bot-msg");
            }
        }

        function addMessage(text, className, id = "") {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + className;
            msgDiv.innerText = text;
            if (id) msgDiv.id = id;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }
    </script>

</body>

</html>
